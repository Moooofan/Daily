<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily - 登入</title>

    <!-- PWA 支援 -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Daily">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== 開場動畫 Splash Screen ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: splashFadeOut 0.5s ease-out 2.5s forwards;
        }

        .splash-logo {
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transform: scale(0.9);
            animation: splashLogoIn 1s ease-out 0.3s forwards;
        }

        .splash-icon {
            width: 50px;
            height: 50px;
            border: 2px solid;
            border-image: linear-gradient(135deg, #888 0%, #fff 50%, #666 100%) 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 300;
            background: linear-gradient(135deg, #666 0%, #fff 40%, #888 60%, #555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .splash-text {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(
                135deg,
                #555 0%,
                #888 20%,
                #fff 40%,
                #ccc 50%,
                #fff 60%,
                #888 80%,
                #555 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2s ease-in-out infinite;
            background-size: 200% 100%;
        }

        @keyframes splashLogoIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes splashFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 200% center;
            }
            100% {
                background-position: -200% center;
            }
        }

        /* ===== 主內容區 ===== */
        .main-content {
            opacity: 0;
            animation: contentFadeIn 0.8s ease-out 2.5s forwards;
        }

        @keyframes contentFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255,255,255,0.02) 0%, transparent 30%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, transparent 0%, transparent 50%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.02) 100%),
                linear-gradient(0deg, transparent 0%, transparent 50%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0.01) 100%);
            background-size: 100px 100px;
            pointer-events: none;
            opacity: 0.5;
        }

        .login-container {
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        /* Logo 區域 */
        .logo-section {
            margin-bottom: 50px;
        }

        .logo-mark {
            width: 70px;
            height: 70px;
            margin: 0 auto 24px;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 0;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 200;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #ffffff;
            margin-left: 12px;
        }

        .tagline {
            font-size: 0.75rem;
            color: #555;
            margin-top: 12px;
            letter-spacing: 6px;
            font-weight: 300;
        }

        /* 登入按鈕區域 */
        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 400;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            border-color: #888;
            background: rgba(255, 255, 255, 0.05);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Google 按鈕 */
        .btn-google:hover {
            border-color: #4285F4;
        }

        /* Apple 按鈕 */
        .btn-apple:hover {
            border-color: #ffffff;
        }

        /* 分隔線 */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider span {
            padding: 0 20px;
        }

        /* 註冊表單 */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 30px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #555;
        }

        .input-group input:focus {
            border-color: #666;
        }

        .input-group .icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 1rem;
        }

        .register-btn {
            padding: 16px 24px;
            background: linear-gradient(90deg, #333 0%, #555 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: linear-gradient(90deg, #444 0%, #666 100%);
        }

        .register-btn:active {
            transform: scale(0.98);
        }

        /* 底部連結 */
        .footer-links {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #555;
        }

        .footer-links a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #ffffff;
        }

        /* 裝飾線條 */
        .decoration {
            position: fixed;
            opacity: 0.03;
            pointer-events: none;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            width: 200px;
            height: 200px;
            border: 1px solid #fff;
            border-radius: 50%;
        }

        .decoration-2 {
            bottom: 15%;
            right: 10%;
            width: 150px;
            height: 150px;
            border: 1px solid #fff;
        }

        .decoration-3 {
            top: 50%;
            right: 5%;
            width: 100px;
            height: 1px;
            background: #fff;
        }

        /* 手機版優化 */
        @media screen and (max-width: 480px) {
            .logo-section {
                margin-bottom: 40px;
            }

            .logo-mark {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }

            .logo {
                font-size: 1.8rem;
                letter-spacing: 8px;
            }

            .tagline {
                letter-spacing: 4px;
            }

            .login-btn {
                padding: 14px 20px;
                font-size: 0.9rem;
            }

            .input-group input {
                padding: 14px 18px 14px 45px;
            }

            .decoration {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 開場動畫 -->
    <div class="splash-screen">
        <div class="splash-logo">
            <div class="splash-icon">D</div>
            <span class="splash-text">Daily</span>
        </div>
    </div>

    <!-- 主內容區 -->
    <div class="main-content">
        <!-- 裝飾線條 -->
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>

        <div class="login-container">
        <!-- Logo 區域 -->
        <div class="logo-section">
            <div class="logo-mark">D</div>
            <h1 class="logo">Daily</h1>
            <p class="tagline">Daily Planner</p>
        </div>

        <!-- 社群登入按鈕 -->
        <div class="login-buttons">
            <a href="/google/authorize" class="login-btn btn-google">
                <svg viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </a>

            <a href="#" class="login-btn btn-apple" onclick="alert('Apple 登入功能開發中'); return false;">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Continue with Apple
            </a>
        </div>

        <!-- 分隔線 -->
        <div class="divider">
            <span>OR</span>
        </div>

        <!-- 註冊表單 -->
        <form class="register-form" onsubmit="alert('Email 註冊功能開發中'); return false;">
            <div class="input-group">
                <span class="icon">@</span>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <span class="icon">*</span>
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="register-btn">LOGIN / REGISTER</button>
        </form>

        <!-- 底部連結 -->
        <div class="footer-links">
            <a href="#">Terms of Service</a> · <a href="#">Privacy Policy</a>
        </div>
    </div>
    </div>
</body>
</html>
