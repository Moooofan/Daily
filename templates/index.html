<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Schedule AI - 每日行程智能規劃</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 頭部 -->
        <header>
            <h1>📅 Daily Schedule AI</h1>
            <p class="subtitle">可即時生成並調整的每日行程系統</p>
        </header>

        <!-- Google Calendar 連接狀態 -->
        <div class="calendar-status" id="calendarStatus">
            <div class="status-indicator">
                <span id="statusIcon">⚪</span>
                <span id="statusText">正在檢查 Google Calendar 連接...</span>
            </div>
            <button id="googleAuthBtn" class="btn btn-secondary" style="display: none;">
                連接 Google Calendar
            </button>
            <button id="googleDisconnectBtn" class="btn btn-danger" style="display: none;">
                中斷連接
            </button>
        </div>

        <!-- 主要內容區 -->
        <div class="main-content">
            <!-- 左側：任務管理 -->
            <div class="panel tasks-panel">
                <div class="panel-header">
                    <h2>📝 我的任務</h2>
                    <button id="addTaskBtn" class="btn btn-primary">+ 新增任務</button>
                </div>

                <div id="tasksList" class="tasks-list">
                    <!-- 任務列表將動態載入 -->
                </div>
            </div>

            <!-- 右側：行程表 -->
            <div class="panel schedule-panel">
                <div class="panel-header">
                    <h2>🗓 今日行程</h2>
                    <div class="schedule-controls">
                        <input type="date" id="scheduleDate" class="date-input">
                        <button id="generateScheduleBtn" class="btn btn-success">
                            🤖 生成行程
                        </button>
                    </div>
                </div>

                <div id="scheduleView" class="schedule-view">
                    <div class="empty-state">
                        <p>點擊「生成行程」按鈕，讓 AI 為你規劃今天的完整行程</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 設定區 -->
        <div class="settings-section">
            <button id="settingsToggle" class="btn btn-secondary">⚙️ 偏好設定</button>
            <div id="settingsPanel" class="settings-panel" style="display: none;">
                <h3>時間設定</h3>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>起床時間</label>
                        <input type="time" id="wakeTime" class="time-input">
                    </div>
                    <div class="setting-item">
                        <label>就寢時間</label>
                        <input type="time" id="sleepTime" class="time-input">
                    </div>
                    <div class="setting-item">
                        <label>早餐時間</label>
                        <input type="time" id="breakfastTime" class="time-input">
                    </div>
                    <div class="setting-item">
                        <label>午餐時間</label>
                        <input type="time" id="lunchTime" class="time-input">
                    </div>
                    <div class="setting-item">
                        <label>晚餐時間</label>
                        <input type="time" id="dinnerTime" class="time-input">
                    </div>
                    <div class="setting-item">
                        <label>緩衝時間（分鐘）</label>
                        <input type="number" id="bufferTime" class="number-input" min="0" max="60">
                    </div>
                </div>
                <button id="saveSettingsBtn" class="btn btn-primary">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 新增任務對話框 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>新增任務</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label>任務名稱 *</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label>預估時間（分鐘）</label>
                    <input type="number" id="taskDuration" value="30" min="5" max="480">
                </div>
                <div class="form-group">
                    <label>優先級</label>
                    <select id="taskPriority">
                        <option value="0">低</option>
                        <option value="1" selected>中</option>
                        <option value="3">高</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>類別</label>
                    <select id="taskCategory">
                        <option value="work">工作</option>
                        <option value="study">學習</option>
                        <option value="personal">個人</option>
                        <option value="health">健康</option>
                        <option value="other" selected>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>偏好時間（選填）</label>
                    <input type="time" id="taskPreferredTime">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">新增</button>
                    <button type="button" class="btn btn-secondary" id="cancelTaskBtn">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading 指示器 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>AI 正在規劃行程中...</p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
