<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - Daily Schedule AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: #1a1a1a;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header a {
            color: #888;
            text-decoration: none;
        }

        .header a:hover {
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .users-table th {
            background: #f9f9f9;
            font-weight: 600;
            color: #666;
        }

        .users-table tr:hover {
            background: #f9f9f9;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-weight: 500;
        }

        .user-email {
            font-size: 0.85rem;
            color: #666;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-admin {
            background: #e3f2fd;
            color: #1565c0;
        }

        .badge-user {
            background: #f5f5f5;
            color: #666;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:hover {
            background: #333;
        }

        .btn-danger {
            background: #ffebee;
            color: #c62828;
        }

        .btn-danger:hover {
            background: #ffcdd2;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .user-detail-section {
            margin-bottom: 20px;
        }

        .user-detail-section h4 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .data-list {
            list-style: none;
        }

        .data-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .data-list li:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .users-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>管理後台</h1>
        <div class="header-actions">
            <a href="/">返回首頁</a>
            <a href="/google/logout">登出</a>
        </div>
    </header>

    <div class="container">
        <!-- 統計卡片 -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>總用戶數</h3>
                <div class="number" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>總待辦事項</h3>
                <div class="number" id="totalTodos">-</div>
            </div>
            <div class="stat-card">
                <h3>總排程數</h3>
                <div class="number" id="totalSchedules">-</div>
            </div>
            <div class="stat-card">
                <h3>總固定排程</h3>
                <div class="number" id="totalRoutines">-</div>
            </div>
        </div>

        <!-- 用戶列表 -->
        <div class="section">
            <h2>用戶列表</h2>
            <div id="usersContainer">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>

    <!-- 用戶詳細資料 Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalUserName">用戶詳細資料</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalContent">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        // 載入統計資料
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.stats.total_users;
                    document.getElementById('totalTodos').textContent = data.stats.total_todos;
                    document.getElementById('totalSchedules').textContent = data.stats.total_schedules;
                    document.getElementById('totalRoutines').textContent = data.stats.total_routines;
                }
            } catch (error) {
                console.error('載入統計失敗:', error);
            }
        }

        // 載入用戶列表
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();

                if (data.success) {
                    renderUsers(data.users);
                }
            } catch (error) {
                console.error('載入用戶失敗:', error);
                document.getElementById('usersContainer').innerHTML = '<p>載入失敗</p>';
            }
        }

        // 渲染用戶列表
        function renderUsers(users) {
            if (users.length === 0) {
                document.getElementById('usersContainer').innerHTML = '<p>尚無用戶</p>';
                return;
            }

            const html = `
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>用戶</th>
                            <th>角色</th>
                            <th>註冊時間</th>
                            <th>最後登入</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>
                                    <div class="user-info">
                                        <img src="${user.picture || 'https://via.placeholder.com/36'}"
                                             alt="" class="user-avatar">
                                        <div>
                                            <div class="user-name">${user.name || '未命名'}</div>
                                            <div class="user-email">${user.email}</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge ${user.is_admin ? 'badge-admin' : 'badge-user'}">
                                        ${user.is_admin ? '管理員' : '一般用戶'}
                                    </span>
                                </td>
                                <td>${formatDate(user.created_at)}</td>
                                <td>${formatDate(user.last_login)}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary" onclick="viewUser(${user.id})">
                                        查看
                                    </button>
                                    <button class="btn btn-sm ${user.is_admin ? 'btn-danger' : 'btn-primary'}"
                                            onclick="toggleAdmin(${user.id}, ${!user.is_admin})">
                                        ${user.is_admin ? '移除管理員' : '設為管理員'}
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('usersContainer').innerHTML = html;
        }

        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 查看用戶詳細資料
        async function viewUser(userId) {
            document.getElementById('userModal').classList.add('active');
            document.getElementById('modalContent').innerHTML = '<div class="loading">載入中...</div>';

            try {
                const response = await fetch(`/api/admin/users/${userId}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.data.user;
                    const todos = data.data.todos;
                    const routines = data.data.routines;

                    document.getElementById('modalUserName').textContent = user.name || user.email;
                    document.getElementById('modalContent').innerHTML = `
                        <div class="user-detail-section">
                            <h4>基本資料</h4>
                            <ul class="data-list">
                                <li><strong>Email:</strong> ${user.email}</li>
                                <li><strong>Google ID:</strong> ${user.google_id}</li>
                                <li><strong>註冊時間:</strong> ${formatDate(user.created_at)}</li>
                                <li><strong>最後登入:</strong> ${formatDate(user.last_login)}</li>
                            </ul>
                        </div>

                        <div class="user-detail-section">
                            <h4>待辦事項 (${todos.length})</h4>
                            ${todos.length > 0 ? `
                                <ul class="data-list">
                                    ${todos.slice(0, 10).map(todo => `
                                        <li>
                                            ${todo.completed ? '✓' : '○'}
                                            ${todo.content}
                                            <span style="color: #888; font-size: 0.8rem;">(${todo.type})</span>
                                        </li>
                                    `).join('')}
                                    ${todos.length > 10 ? `<li style="color: #888;">... 還有 ${todos.length - 10} 項</li>` : ''}
                                </ul>
                            ` : '<p style="color: #888;">尚無待辦事項</p>'}
                        </div>

                        <div class="user-detail-section">
                            <h4>固定排程 (${routines.length})</h4>
                            ${routines.length > 0 ? `
                                <ul class="data-list">
                                    ${routines.map(routine => `
                                        <li>
                                            ${routine.enabled ? '✓' : '○'}
                                            ${routine.title}
                                            <span style="color: #888; font-size: 0.8rem;">
                                                (${routine.start_time} - ${routine.end_time})
                                            </span>
                                        </li>
                                    `).join('')}
                                </ul>
                            ` : '<p style="color: #888;">尚無固定排程</p>'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('載入用戶資料失敗:', error);
                document.getElementById('modalContent').innerHTML = '<p>載入失敗</p>';
            }
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        // 切換管理員權限
        async function toggleAdmin(userId, isAdmin) {
            const action = isAdmin ? '設為管理員' : '移除管理員權限';
            if (!confirm(`確定要${action}嗎？`)) return;

            try {
                const response = await fetch(`/api/admin/users/${userId}/admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_admin: isAdmin })
                });

                const data = await response.json();
                if (data.success) {
                    loadUsers();
                }
            } catch (error) {
                console.error('更新權限失敗:', error);
                alert('更新失敗');
            }
        }

        // 點擊 Modal 外部關閉
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 初始化
        loadStats();
        loadUsers();
    </script>
</body>
</html>
